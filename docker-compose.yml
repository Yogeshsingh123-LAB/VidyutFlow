services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vidyut, POSTGRES_PASSWORD: vidyut, POSTGRES_DB: vidyutflow }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vidyut -d vidyutflow"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    # Lite: reserved for queue/cache wiring; app runs without it. Full use is roadmap.
  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://vidyut:vidyut@db:5432/vidyutflow"
      REDIS_URL: "redis://redis:6379/0"
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports: ["8000:8000"]
    volumes: ["./backend/app/ml/models:/code/app/ml/models"]
  frontend:
    build: ./frontend
    depends_on: { backend: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5173:5173"]
    environment: { VITE_PROXY_TARGET: "http://backend:8000" }
volumes: { pgdata: {} }
