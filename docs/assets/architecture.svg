<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1100" height="640" fill="#0b1220"/>
  <text x="550" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">VidyutFlow — Cloud-to-Edge Orchestration (PS000125)</text>
  <text x="550" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Built today (solid, colored) vs Roadmap (dashed, grey) — demo build, synthetic data</text>

  <!-- EDGE / CLIENTS -->
  <rect x="40" y="90" width="240" height="120" rx="10" fill="#101c35" stroke="#22d3ee" stroke-width="2"/>
  <text x="160" y="118" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">CONSUMER PORTAL (PWA)</text>
  <text x="160" y="142" text-anchor="middle" fill="#cbd5e1" font-size="11">New-connection wizard · status</text>
  <text x="160" y="162" text-anchor="middle" fill="#cbd5e1" font-size="11">bills/demo · complaints · ML feedback</text>
  <text x="160" y="186" text-anchor="middle" fill="#64748b" font-size="10">React 19 · Vite 8 · Tailwind 4</text>

  <rect x="40" y="240" width="240" height="120" rx="10" fill="#101c35" stroke="#22d3ee" stroke-width="2"/>
  <text x="160" y="268" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">FIELD ENGINEER (EDGE PWA)</text>
  <text x="160" y="292" text-anchor="middle" fill="#cbd5e1" font-size="11">Offline queue · UUIDv4 entries</text>
  <text x="160" y="312" text-anchor="middle" fill="#cbd5e1" font-size="11">airplane-mode inspection → sync</text>
  <text x="160" y="336" text-anchor="middle" fill="#64748b" font-size="10">service worker · de-duplicated sync</text>

  <rect x="40" y="390" width="240" height="110" rx="10" fill="#101c35" stroke="#22d3ee" stroke-width="2"/>
  <text x="160" y="418" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">STAFF WORKSPACES</text>
  <text x="160" y="442" text-anchor="middle" fill="#cbd5e1" font-size="11">Officer queue · engineer tasks</text>
  <text x="160" y="462" text-anchor="middle" fill="#cbd5e1" font-size="11">management KPIs · admin console</text>
  <text x="160" y="486" text-anchor="middle" fill="#64748b" font-size="10">role-scoped JWT · Ctrl-K palette</text>

  <!-- arrows to control plane -->
  <line x1="280" y1="150" x2="385" y2="230" stroke="#22d3ee" stroke-width="1.6"/>
  <line x1="280" y1="300" x2="385" y2="290" stroke="#22d3ee" stroke-width="1.6"/>
  <line x1="280" y1="445" x2="385" y2="350" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="330" y="205" fill="#64748b" font-size="9">HTTPS / REST</text>

  <!-- CONTROL PLANE -->
  <rect x="385" y="90" width="330" height="410" rx="12" fill="#0f2438" stroke="#34d399" stroke-width="2.5"/>
  <text x="550" y="120" text-anchor="middle" fill="#34d399" font-size="15" font-weight="700">CONTROL PLANE — FastAPI</text>
  <text x="550" y="140" text-anchor="middle" fill="#94a3b8" font-size="10">“Enter Once, Use Everywhere” · one data model for all portals</text>

  <rect x="410" y="155" width="280" height="52" rx="8" fill="#12324a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="176" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">Workflow engine</text>
  <text x="550" y="194" text-anchor="middle" fill="#93c5fd" font-size="10">validate → classify → SLA-risk → route → assign</text>

  <rect x="410" y="217" width="280" height="52" rx="8" fill="#12324a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="238" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">ML policies (scikit-learn, synthetic-trained)</text>
  <text x="550" y="256" text-anchor="middle" fill="#93c5fd" font-size="10">category/severity · SLA-breach risk + reasons</text>

  <rect x="410" y="279" width="280" height="52" rx="8" fill="#12324a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="300" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">TF-IDF Policy RAG + optional Gemini UI</text>
  <text x="550" y="318" text-anchor="middle" fill="#93c5fd" font-size="10">sources cited · notification centre · SLA watchlist</text>

  <rect x="410" y="341" width="280" height="52" rx="8" fill="#12324a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="362" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">Security &amp; audit</text>
  <text x="550" y="380" text-anchor="middle" fill="#93c5fd" font-size="10">JWT + RBAC + bcrypt · hash-chained audit log</text>

  <rect x="410" y="403" width="280" height="52" rx="8" fill="#12324a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="424" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">Field sync contract</text>
  <text x="550" y="442" text-anchor="middle" fill="#93c5fd" font-size="10">JWT-authenticated · idempotent (client_uuid once)</text>

  <text x="550" y="480" text-anchor="middle" fill="#64748b" font-size="10">110 backend tests · 37 frontend suites · CI · Compose</text>

  <!-- DATA -->
  <rect x="760" y="130" width="150" height="90" rx="10" fill="#101c35" stroke="#34d399" stroke-width="2"/>
  <text x="835" y="162" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">DATABASE</text>
  <text x="835" y="184" text-anchor="middle" fill="#cbd5e1" font-size="10">PostgreSQL (Compose)</text>
  <text x="835" y="202" text-anchor="middle" fill="#cbd5e1" font-size="10">SQLite fallback · checksummed backup</text>
  <line x1="715" y1="230" x2="760" y2="190" stroke="#34d399" stroke-width="1.6"/>

  <rect x="760" y="250" width="150" height="80" rx="10" fill="#101c35" stroke="#34d399" stroke-width="2"/>
  <text x="835" y="282" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">ML ARTIFACTS</text>
  <text x="835" y="304" text-anchor="middle" fill="#cbd5e1" font-size="10">metrics.json + joblib</text>
  <text x="835" y="320" text-anchor="middle" fill="#64748b" font-size="9">reproducible (make train)</text>
  <line x1="715" y1="290" x2="760" y2="290" stroke="#34d399" stroke-width="1.6"/>

  <!-- ROADMAP (dashed grey) -->
  <rect x="760" y="370" width="300" height="200" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="910" y="398" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">ROADMAP (not built)</text>
  <text x="910" y="424" text-anchor="middle" fill="#64748b" font-size="11">Legacy ERP adapters (billing/HR/SCADA)</text>
  <text x="910" y="448" text-anchor="middle" fill="#64748b" font-size="11">Kafka / Temporal · WebSockets · GraphQL/GIS</text>
  <text x="910" y="472" text-anchor="middle" fill="#64748b" font-size="11">Flutter offline client · on-device inference</text>
  <text x="910" y="496" text-anchor="middle" fill="#64748b" font-size="11">Multi-AZ DR · Vault · WAF · SSO</text>
  <text x="910" y="520" text-anchor="middle" fill="#64748b" font-size="11">Hardware modernisation tiers (proposal)</text>
  <text x="910" y="548" text-anchor="middle" fill="#475569" font-size="10">API contracts stay stable while engines change</text>
  <line x1="715" y1="430" x2="758" y2="430" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- footnote -->
  <text x="550" y="600" text-anchor="middle" fill="#475569" font-size="10">ML models are trained on SYNTHETIC data — triage probabilities, not verdicts; every final decision stays with the officer.</text>
  <text x="550" y="620" text-anchor="middle" fill="#475569" font-size="10">VidyutFlow · Seva First Innovation Challenge · PS000125 · UGVCL · built-vs-roadmap map: docs/REQUIREMENT_MAPPING.md</text>
</svg>
