# GitHub Actions CI Workflow Template (docs/ci.yml)
# NOTE: Stored as a template at docs/ci.yml because fine-grained `contents`-only PATs cannot push `.github/workflows/*`.
# To activate hosted GitHub Actions runs, copy this file to `.github/workflows/ci.yml` in the GitHub Web UI (or push with `workflow` PAT scope).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (make test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend test suite & 55/55 OpenAPI coverage gate
        run: cd backend && python scripts/audit_api_coverage.py
      - name: Verify OOD GERC/CGRF NLP benchmark & cold-start DR failover proof
        run: cd backend && python scripts/evaluate_realworld_benchmark.py && python scripts/cold_start_dr_proof.py

  frontend-tests-build:
    name: Frontend tests + build (make build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run frontend test suites
        run: cd frontend && npm test
      - name: Type check
        run: cd frontend && npm run lint
      - name: Production build
        run: cd frontend && npm run build
